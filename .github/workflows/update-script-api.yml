name: update script api definitions

# refreshes the official @minecraft/* type definitions used for Script API IntelliSense.
# run it by hand: Actions tab > "update script api definitions" > Run workflow. it also runs weekly.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install typescript (only used to read the definitions)
        run: npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/ts" typescript@5.9.3
      - name: download the newest official definitions
        run: TS_DIR="$RUNNER_TEMP/ts" node tools/update-script-api.mjs
      - name: commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add js/script-api/definitions
          if git diff --cached --quiet; then echo "definitions already up to date"; else git commit -m "update script api definitions" && git push; fi
